apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxe-frontend
  labels:
    app: luxe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luxe-frontend
  template:
    metadata:
      labels:
        app: luxe-frontend
    spec:
      containers:
        - name: luxe-frontend
          image: public.ecr.aws/your-public-repo/luxe-travel-app:latest
          ports:
            - containerPort: 80
          env:
            - name: FLASK_ENV
              valueFrom:
                configMapKeyRef:
                  name: luxe-env-config
                  key: FLASK_ENV
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"