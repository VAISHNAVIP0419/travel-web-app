apiVersion: apps/v1
kind: Deployment
metadata:
  name: luxe-react-frontend
  labels:
    app: luxe-react
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luxe-react
  template:
    metadata:
      labels:
        app: luxe-react
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: luxe-react-nginx
          image: 047719648597.dkr.ecr.ap-south-1.amazonaws.com/luxe-travel-app-repo:latest
          ports:
            - containerPort: 80